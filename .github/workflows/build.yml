name: Build Project

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # 編譯 x64 版本 (產生 tool.exe 與 64位元 DLL)
      - name: Build x64
        run: |
          xmake repo -u
          xmake f -m release -a x64 -y
          xmake -y

      # 編譯 x86 版本 (僅為了產生 32位元 DLL)
      - name: Build x86
        run: |
          xmake f -m release -a x86 -y
          xmake -y

      # 整理檔案：將 32 與 64 位元檔案集中到一個資料夾方便打包
      - name: Prepare Artifact
        run: |
          mkdir dist
          copy build\windows\x64\release\locale_emulator_plus_tool.exe dist\
          copy build\windows\x64\release\locale_emulator_plus64.dll dist\
          copy build\windows\x86\release\locale_emulator_plus32.dll dist\

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locale-Emulator-Plus-Universal
          path: dist/
